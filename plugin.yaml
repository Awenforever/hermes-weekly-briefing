name: hermes-weekly-briefing
version: 5.2.0
manifest_version: 1
api_version: 1
description: Research discovery, author-team context, polished PDF rendering, and email-only delivery.
author: Awenforever
license: MIT
homepage: https://github.com/Awenforever/hermes-weekly-briefing
tags: [research, weekly-report, pdf, email]
requires_hermes: ">=0.21.3,<0.22"
config_schema:
  max_selected:
    type: int
    default: 5
    description: Number of papers selected for each report.
  use_user_feedback:
    type: bool
    default: false
    description: Allow only explicit, user-confirmed feedback records to influence discovery.
  delivery:
    type: str
    default: email
    description: Delivery channel; Weekly Briefing accepts email only.
  analysis_model:
    type: str
    default: ""
    description: Optional Hermes model alias; empty inherits the active primary model.
  analysis_fallback_model:
    type: str
    default: ""
    description: Optional Hermes model alias; empty inherits Hermes fallback routing.
